name: Temporary Rayon SVG Export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'automation/rayon-svg-export-20260827'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Download and validate Rayon SVG catalogue
        run: python tools/rayon-export/export.py

      - name: Show export summary
        if: success()
        run: cat export-output/summary.json

      - name: Upload complete SVG bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rayon-blocks-svgs
          path: export-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
